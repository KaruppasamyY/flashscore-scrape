version: "3.9"

services:
  api:
    build:
      context: ./fastapi-app
    container_name: flashscore-api
    ports:
      - "8000:8000"      # host:container
    networks:
      - internal-net

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
    depends_on:
      - api
    networks:
      - internal-net

networks:
  internal-net:
